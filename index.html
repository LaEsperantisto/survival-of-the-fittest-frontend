<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Survival of the Fittest</title>
  <script type="module" crossorigin src="./assets/index-yGAjPLPR.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Ddqov-i0.css">
</head>
<body>
<div id="game-wrap">
  <div id="vision-vignette"></div>
  <div id="vision-red"></div>
  <div id="vision-water"></div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="crosshair">+</div>
  <div id="breakbar" class="hidden"><div id="breakfill"></div></div>
  <div id="prompt" class="hidden"></div>
  <div id="clockbox"><span id="clock-day">Day 1</span> <span id="clock-time">06:00</span> <span id="clock-temp">30&#176;C</span></div>
  <div id="quest"></div>
  <div id="bars">
    <div class="bar-row"><span class="bar-label">HP</span>
      <div class="bar" id="bar-health"><div class="fill"></div><div class="safe"></div></div></div>
    <div class="bar-row"><span class="bar-label">H&#8322;O</span>
      <div class="bar" id="bar-water"><div class="fill"></div><div class="safe"></div></div></div>
    <div class="bar-row"><span class="bar-label">TEMP</span>
      <div class="bar" id="bar-heat"><div class="fill"></div><div class="safe"></div></div></div>
  </div>
  <div id="held"></div>
  <div id="weight"></div>
  <div id="toast"></div>
</div>

<!-- Mobile controls -->
<div id="mobile" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div id="mbtns">
    <button id="m-jump">Jump</button>
    <button id="m-break">Break</button>
    <button id="m-place">Place</button>
    <button id="m-act">Act</button>
    <button id="m-drink">Drink</button>
    <button id="m-next">Item</button>
    <button id="m-inv">Bag</button>
  </div>
</div>

<!-- Screens -->
<div id="screen-title" class="screen">
  <h1>Survival of the Fittest</h1>
  <p class="sub">You woke up in the wreckage. The desert wants you dead. Don't be.</p>
  <p id="best-score" class="sub"></p>
  <div id="worldlist"></div>
  <div id="newworld">
    <input id="seed-input" type="text" placeholder="seed (blank = random)">
    <input id="world-name" type="text" placeholder="world name (blank = seed)">
    <button id="btn-create">Create World</button>
    <button id="btn-guest">Guest World</button>
    <button id="btn-import">Import World</button>
    <input id="import-file" type="file" accept=".json" class="hidden">
    <button id="btn-instructions">How to survive</button>
    <button id="btn-settings">Settings</button>
  </div>
</div>

<div id="screen-instructions" class="screen hidden">
  <h2>How to survive</h2>
  <div id="instr-body"></div>
  <button class="close-btn">Back</button>
</div>

<div id="screen-settings" class="screen hidden">
  <h2>Settings</h2>
  <div id="settings-body"></div>
  <button class="close-btn">Back</button>
</div>

<div id="screen-death" class="screen hidden">
  <h2>You died</h2>
  <p id="death-cause"></p>
  <p id="death-stats"></p>
  <button id="btn-respawn">Respawn at Save Point</button>
  <button id="btn-death-title">Quit to Title</button>
</div>

<div id="screen-win" class="screen hidden">
  <h2 id="win-title">Evacuation Complete</h2>
  <p id="win-stats"></p>
  <button id="btn-win-continue">Keep Surviving</button>
  <button id="btn-win-title">Quit to Title</button>
</div>

<div id="screen-pause" class="screen hidden">
  <h2>Paused</h2>
  <button id="btn-resume">Resume</button>
  <button id="btn-pause-settings">Settings</button>
  <button id="btn-save">Save Game</button>
  <button id="btn-exportworld">Export World (.json)</button>
  <button id="btn-quit">Quit to Title</button>
  <button id="btn-cheats">Cheats</button>
  <div id="cheats" class="hidden">
    <button data-frac="0">Midnight</button>
    <button data-frac="0.25">Dawn</button>
    <button data-frac="0.5">Noon</button>
    <button data-frac="0.75">Dusk</button>
  </div>
</div>

<!-- Inventory / crafting -->
<div id="ui-inventory" class="panel hidden">
  <h3>Inventory <span id="inv-weight"></span></h3>
  <div id="inv-main">
    <div id="inv-grid"></div>
    <div id="inv-temp-wrap">
      <div class="temp-label">Temporary storage</div>
      <div id="inv-temp"></div>
      <button id="btn-drop-temp" class="hidden">Drop</button>
    </div>
  </div>
  <div id="inv-side"></div>
  <button class="close-btn">Close</button>
</div>

<div id="ui-craft" class="panel hidden">
  <h3 id="craft-title">Crafting Bench</h3>
  <div id="craft-list"></div>
  <div id="smelt-ui" class="hidden">
    <div>Fuel: <span id="smelt-fuel"></span> <button id="btn-addfuel">Add wood</button></div>
  </div>
  <button class="close-btn">Close</button>
</div>

<div id="ui-cache" class="panel hidden">
  <h3 id="cache-title">Death Cache — take your belongings</h3>
  <div id="cache-list"></div>
  <button class="close-btn">Close</button>
</div>

</body>
</html>
